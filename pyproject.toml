[project]
name = "learnix"
version = "0.2.0"
description = "Machine learning fundamentals from scratch: linear regression, loss functions and gradient descent in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shiv Kumar" }]
keywords = ["machine-learning", "linear-regression", "gradient-descent", "from-scratch", "education", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "scikit-learn>=1.4"]
notebooks = ["numpy", "pandas", "scikit-learn", "matplotlib", "jupyter", "ipykernel", "joblib"]

[project.urls]
Homepage = "https://github.com/shivkumarsinghsky/learnix"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnix"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Lessons are deliberately written as beginner-style loops.
"lessons/*" = ["SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
